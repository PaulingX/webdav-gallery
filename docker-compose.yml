services:
  webdav-gallery:
    build:
      context: .
      # 默认快速模式（需先 mvn -B -DskipTests package，只需拉 ~60MB JRE）
      # 无本地 JDK/Maven 时改用多阶段: DOCKERFILE=Dockerfile docker compose up -d --build
      dockerfile: ${DOCKERFILE:-Dockerfile.fast}
    container_name: webdav-gallery
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # H2 数据库文件目录（容器内路径），挂载目标自动跟随此变量
      H2_DATA_DIR: ${H2_DATA_DIR:-/app/data}
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms128m -Xmx512m"
      # 登录账号密码（也可在 .env 中配置）
      APP_AUTH_USERNAME: ${APP_AUTH_USERNAME:-admin}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:-admin123}
    volumes:
      # 宿主机路径:容器内路径（容器内路径须与 H2_DATA_DIR 一致才能持久化）
      - ${DATA_DIR_HOST:-./data}:${H2_DATA_DIR:-/app/data}
    restart: unless-stopped
