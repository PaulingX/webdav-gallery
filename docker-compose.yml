services:
  webdav-gallery:
    build: .
    container_name: webdav-gallery
    ports:
      - "8080:8080"
    environment:
      H2_DATA_DIR: /app/data
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms128m -Xmx512m"
    volumes:
      - ./data:/app/data   # H2 数据持久化，重建容器不丢源配置
    restart: unless-stopped
